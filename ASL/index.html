<!doctype html>
<html lang="en">
<head>

<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07090d;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
  }
  #stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
  }
  video {
    display: none;
  }
  canvas {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .glass {
    background: rgba(11, 14, 20, 0.78);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    color: #f8fafc;
  }
  .top {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: 12px;
    right: 12px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    z-index: 20;
  }
  .chip {
    padding: 8px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px #34d399;
  }
  .dot.paused {
    background: #f59e0b;
    box-shadow: 0 0 8px #f59e0b;
  }
  .island {
    order: 3;
    width: 100%;
    max-width: none;
    padding: 8px 14px;
    border-radius: 16px;
    text-align: center;
  }
  @media (min-width: 720px) {
    .island {
      order: 0;
      width: auto;
      flex: 1 1 200px;
      max-width: 320px;
    }
  }
  #sign {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  #sub {
    font-size: 11px;
    color: rgba(226, 232, 240, 0.68);
    margin-top: 2px;
  }
  .track {
    height: 4px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
    margin-top: 6px;
    overflow: hidden;
  }
  #bar {
    height: 100%;
    width: 0%;
    background: #38bdf8;
    transition: width 50ms linear;
  }
  .btns {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 6px;
  }
  button.glass {
    min-height: 40px;
    min-width: 40px;
    padding: 7px 11px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
  }
  @media (min-width: 720px) {
    button.glass {
      min-height: 44px;
      min-width: 44px;
      padding: 8px 13px;
      font-size: 13px;
    }
  }
  button.glass:active {
    transform: scale(0.97);
  }
  #autoBtn.active {
    border-color: rgba(56, 189, 248, 0.65);
    background: rgba(56, 189, 248, 0.22);
  }
  #autoBtn.paused {
    border-color: rgba(245, 158, 11, 0.65);
    background: rgba(245, 158, 11, 0.2);
  }
  #historyBtn.active {
    border-color: rgba(168, 85, 247, 0.65);
    background: rgba(168, 85, 247, 0.22);
  }
  #speakBtn {
    border-color: rgba(52, 211, 153, 0.55);
    background: rgba(52, 211, 153, 0.18);
  }
  #historyDrawer {
    position: absolute;
    top: max(128px, calc(env(safe-area-inset-top) + 116px));
    right: 12px;
    width: min(290px, calc(100vw - 24px));
    max-height: 50dvh;
    border-radius: 16px;
    padding: 12px;
    z-index: 30;
    display: none;
    flex-direction: column;
    gap: 8px;
  }
  @media (min-width: 720px) {
    #historyDrawer {
      top: max(76px, calc(env(safe-area-inset-top) + 64px));
    }
  }
  #historyDrawer.open {
    display: flex;
  }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: rgba(226, 232, 240, 0.85);
    padding-bottom: 6px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }
  #historyClearBtn {
    background: none;
    border: none;
    color: #f87171;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 2px 6px;
  }
  #historyList {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 38dvh;
  }
  .history-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.06);
    font-size: 13px;
  }
  .history-sign {
    font-weight: 800;
    font-size: 15px;
    color: #38bdf8;
    min-width: 24px;
  }
  .history-detail {
    font-size: 11px;
    color: rgba(226, 232, 240, 0.65);
  }
  .history-empty {
    font-size: 12px;
    color: rgba(226, 232, 240, 0.5);
    padding: 8px 2px;
    text-align: center;
  }
  .dock {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: min(780px, calc(100vw - 24px));
    padding: 12px 16px;
    border-radius: 18px;
    z-index: 20;
  }
  #text {
    font-size: clamp(18px, 4.5vw, 24px);
    font-weight: 700;
    min-height: 28px;
    word-break: break-word;
  }
  #text:empty::before {
    content: "Auto ON — Show hand to spell (trace J / Z) • Tap Auto to pause";
    color: rgba(226, 232, 240, 0.42);
    font-size: 13px;
    font-weight: 500;
  }
  #meta {
    margin-top: 4px;
    font-size: 11px;
    color: rgba(226, 232, 240, 0.52);
    font-family: ui-monospace, monospace;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="view"></canvas>
  <div class="top">
    <div class="chip glass"><span id="liveDot" class="dot"></span>ASL LIVE <span id="fps" style="opacity:.65">0 FPS</span></div>
    <div class="island glass">
      <div id="sign">LOADING...</div>
      <div id="sub">Initializing MediaPipe (2 hands) + ONNX</div>
      <div class="track"><div id="bar"></div></div>
    </div>
    <div class="btns">
      <button id="autoBtn" class="glass active" type="button">Auto: ON</button>
      <button id="historyBtn" class="glass" type="button">History (0)</button>
      <button id="spaceBtn" class="glass" type="button">Space</button>
      <button id="delBtn" class="glass" type="button">⌫</button>
      <button id="speakBtn" class="glass" type="button">Speak</button>
      <button id="clearBtn" class="glass" type="button">Clear</button>
    </div>
  </div>
  <div id="historyDrawer" class="glass" aria-label="Recent Signs">
    <div class="history-head">
      <span>Recent Signs</span>
      <button id="historyClearBtn" type="button">Clear</button>
    </div>
    <div id="historyList">
      <div class="history-empty">No signs locked yet.</div>
    </div>
  </div>
  <div class="dock glass">
    <div id="text"></div>
    <div id="meta">2-Hand MediaPipe + On-Device ONNX Web • Tip: turn off iOS/Mac Camera Reactions to avoid balloons</div>
  </div>
</div>
<script type="module">
import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const BACKEND_URL = "";
const LETTER_HOLD_MS = 350;
const LETTER_COOLDOWN_MS = 450;
const MOTION_COOLDOWN_MS = 650;
const MIN_CONF = 0.72;
const MIN_MARGIN = 0.15;
const MAX_HISTORY = 50;

const CONNS = [
  [0, 1], [1, 2], [2, 3], [3, 4],
  [0, 5], [5, 6], [6, 7], [7, 8],
  [5, 9], [9, 10], [10, 11], [11, 12],
  [9, 13], [13, 14], [14, 15], [15, 16],
  [13, 17], [17, 18], [18, 19], [19, 20],
  [0, 17]
];
const TIPS = [4, 8, 12, 16, 20];
const DIGIT_RE = /^\d+$/;

const video = document.getElementById("cam");
const canvas = document.getElementById("view");
const ctx = canvas.getContext("2d");
const off = document.createElement("canvas");
const offCtx = off.getContext("2d");

const autoBtn = document.getElementById("autoBtn");
const historyBtn = document.getElementById("historyBtn");
const historyDrawer = document.getElementById("historyDrawer");
const historyList = document.getElementById("historyList");
const liveDot = document.getElementById("liveDot");

let handLM, session, classes = [], inDim = 68, outText = "", probBuf = [];
let autoMode = true;
let stableTok = null, stableStart = 0, cooldown = 0, busy = false, lastTs = performance.now();
let jTrail = [], zTrail = [], jMiss = 0, zMiss = 0, lastScale = 0.1;
const signHistory = [];

const renderText = () => {
  document.getElementById("text").textContent = outText;
};

function updateAutoUI() {
  autoBtn.textContent = autoMode ? "Auto: ON" : "Paused";
  autoBtn.classList.toggle("active", autoMode);
  autoBtn.classList.toggle("paused", !autoMode);
  liveDot.classList.toggle("paused", !autoMode);
}

function renderHistory() {
  historyBtn.textContent = `History (${signHistory.length})`;
  if (!signHistory.length) {
    historyList.innerHTML = `<div class="history-empty">No signs locked yet.</div>`;
    return;
  }
  historyList.innerHTML = signHistory
    .map(item => `
      <div class="history-row">
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="history-sign">${item.sign}</span>
          <span class="history-detail">${item.method}${item.conf ? ` • ${item.conf}` : ""}</span>
        </div>
        <span class="history-detail">${item.time}</span>
      </div>`)
    .join("");
}

function recordHistory(sign, method, conf = null) {
  if (!sign) return;
  signHistory.unshift({
    sign: String(sign),
    method,
    conf: typeof conf === "number" ? `${Math.round(conf * 100)}%` : "",
    time: new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })
  });
  if (signHistory.length > MAX_HISTORY) signHistory.pop();
  renderHistory();
}

autoBtn.onclick = () => {
  autoMode = !autoMode;
  probBuf = [];
  stableTok = null;
  jTrail = [];
  zTrail = [];
  updateAutoUI();
};

historyBtn.onclick = () => {
  const open = historyDrawer.classList.toggle("open");
  historyBtn.classList.toggle("active", open);
};

document.getElementById("historyClearBtn").onclick = () => {
  signHistory.length = 0;
  renderHistory();
};

document.getElementById("spaceBtn").onclick = () => {
  outText += " ";
  renderText();
};

document.getElementById("delBtn").onclick = () => {
  outText = outText.slice(0, -1);
  renderText();
};

document.getElementById("clearBtn").onclick = () => {
  outText = "";
  renderText();
};

document.getElementById("speakBtn").onclick = async () => {
  const raw = outText.trim();
  if (!raw) return;
  let spoken = raw;
  if (BACKEND_URL) {
    try {
      const r = await fetch(`${BACKEND_URL}/api/interpret`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: raw, emotion: "Neutral" })
      });
      if (r.ok) {
        const j = await r.json();
        if (j.sentence) {
          spoken = j.sentence;
          outText = j.sentence;
          renderText();
        }
      }
    } catch (_) {}
  }
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(new SpeechSynthesisUtterance(spoken));
  }
};

const d2 = (a, b, ax) => Math.hypot((a.x - b.x) * ax, a.y - b.y);

function extractGeom(lms) {
  const ax = canvas.width / Math.max(1, canvas.height);
  const wx = lms[0].x, wy = lms[0].y, wz = lms[0].z;
  const rel = lms.map(p => [(p.x - wx) * ax, p.y - wy, (p.z - wz) * ax]);
  const s = Math.hypot(rel[9][0], rel[9][1], rel[9][2]) + 1e-6;
  const norm = rel.map(p => [p[0] / s, p[1] / s, p[2] / s]);
  const g = [];
  for (const p of norm) g.push(p[0], p[1], p[2]);
  if (inDim === 68) {
    for (const id of TIPS) {
      g.push(Math.hypot(norm[id][0], norm[id][1], norm[id][2]));
    }
  }
  return new Float32Array(g);
}

function refineUV(probs, g) {
  const dot = (g[24] - g[36]) * (g[15] - g[27]) + (g[25] - g[37]) * (g[16] - g[28]);
  if (dot < 0) return;
  const iu = classes.indexOf("U"), iv = classes.indexOf("V");
  if (iu < 0 || iv < 0) return;
  let bi = 0;
  for (let i = 1; i < probs.length; i++) {
    if (probs[i] > probs[bi]) bi = i;
  }
  if (bi !== iu && bi !== iv) return;
  const dist = (a, b) => Math.hypot(g[a * 3] - g[b * 3], g[a * 3 + 1] - g[b * 3 + 1], g[a * 3 + 2] - g[b * 3 + 2]);
  const mass = probs[iu] + probs[iv];
  const pV = 1 / (1 + Math.exp(-((dist(8, 12) / (dist(5, 9) + 1e-6)) - 1.42) * 10));
  probs[iv] = mass * pV;
  probs[iu] = mass * (1 - pV);
}

function isTracingMotion() {
  const moved = (trail) => {
    if (trail.length < 4) return false;
    const f = trail[0], l = trail[trail.length - 1];
    return Math.hypot(l.x - f.x, l.y - f.y) > lastScale * 0.14;
  };
  return moved(jTrail) || moved(zTrail);
}

function checkJZ(lms) {
  const ax = canvas.width / Math.max(1, canvas.height);
  const s = d2(lms[0], lms[9], ax) + 1e-6;
  lastScale = s;
  const pinkyUp = d2(lms[20], lms[0], ax) > d2(lms[18], lms[0], ax) * 1.15 && d2(lms[20], lms[17], ax) > s * 0.45;
  const idxUp = d2(lms[8], lms[0], ax) > d2(lms[6], lms[0], ax) * 1.25 && d2(lms[8], lms[5], ax) > s * 0.55;
  const curled = (t, m) => d2(lms[t], lms[0], ax) < d2(lms[m], lms[0], ax) * 1.32;

  if (pinkyUp && curled(8, 6) && curled(12, 10) && curled(16, 14)) {
    jMiss = 0;
    jTrail.push({ x: lms[20].x * ax, y: lms[20].y });
    if (jTrail.length > 26) jTrail.shift();
    if (jTrail.length >= 7) {
      let maxY = -1e9, maxI = 0;
      for (let i = 0; i < jTrail.length; i++) {
        if (jTrail[i].y > maxY) {
          maxY = jTrail[i].y;
          maxI = i;
        }
      }
      const f = jTrail[0], l = jTrail[jTrail.length - 1];
      if ((maxY - f.y) / s > 0.35 && Math.abs(l.x - f.x) / s > 0.28 && ((maxY - l.y) / s > 0.06 || Math.abs(l.x - jTrail[maxI].x) / s > 0.22)) {
        jTrail = [];
        zTrail = [];
        return "J";
      }
    }
  } else if (++jMiss > 3) {
    jTrail = [];
  }

  if (idxUp && curled(12, 10) && curled(16, 14) && curled(20, 18)) {
    zMiss = 0;
    zTrail.push({ x: lms[8].x * ax, y: lms[8].y });
    if (zTrail.length > 34) zTrail.shift();
    if (zTrail.length >= 10) {
      const n = zTrail.length, p0 = zTrail[0], pn = zTrail[n - 1];
      for (let i1 = 2; i1 < n - 5; i1++) {
        const dx1 = zTrail[i1].x - p0.x;
        if (Math.abs(dx1) < s * 0.30) continue;
        for (let i2 = i1 + 2; i2 < n - 2; i2++) {
          const dx2 = zTrail[i2].x - zTrail[i1].x;
          const dy2 = zTrail[i2].y - zTrail[i1].y;
          const dx3 = pn.x - zTrail[i2].x;
          if (dx1 * dx2 < 0 && dx2 * dx3 < 0 && Math.abs(dx2) > s * 0.30 && Math.abs(dx3) > s * 0.30 && dy2 > s * 0.20) {
            jTrail = [];
            zTrail = [];
            return "Z";
          }
        }
      }
    }
  } else if (++zMiss > 3) {
    zTrail = [];
  }
  return null;
}

function drawHand(lms, w, h, handIndex) {
  ctx.save();
  const activeColor = !autoMode
    ? "rgba(148, 163, 184, 0.7)"
    : (stableTok ? "rgba(52, 211, 153, 0.92)" : (handIndex === 0 ? "rgba(56, 189, 248, 0.9)" : "rgba(251, 191, 36, 0.85)"));
  ctx.strokeStyle = activeColor;
  ctx.lineWidth = 2.4;
  ctx.lineCap = "round";
  for (const [a, b] of CONNS) {
    ctx.beginPath();
    ctx.moveTo(lms[a].x * w, lms[a].y * h);
    ctx.lineTo(lms[b].x * w, lms[b].y * h);
    ctx.stroke();
  }
  for (let i = 0; i < lms.length; i++) {
    const tip = TIPS.includes(i);
    ctx.beginPath();
    ctx.arc(lms[i].x * w, lms[i].y * h, tip ? 4.6 : 2.8, 0, Math.PI * 2);
    ctx.fillStyle = tip ? activeColor : "#0b0e14";
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 1.4;
    ctx.stroke();
  }
  ctx.restore();
}

async function init() {
  updateAutoUI();
  const meta = await (await fetch("./meta.json")).json();
  classes = meta.classes;
  inDim = meta.in_dim;
  session = await ort.InferenceSession.create("./letters.onnx", { executionProviders: ["wasm"] });
  const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  handLM = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.45
  });
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  await video.play();
  canvas.width = off.width = video.videoWidth;
  canvas.height = off.height = video.videoHeight;
  document.getElementById("sign").textContent = "READY";
  document.getElementById("sub").textContent = "Show hand to spell";
  requestAnimationFrame(loop);
}

async function predict(geom) {
  busy = true;
  try {
    if (isTracingMotion()) {
      stableTok = null;
      document.getElementById("sign").textContent = "TRACING...";
      document.getElementById("sub").textContent = "Finish J hook or Z zig";
      document.getElementById("bar").style.width = "50%";
      document.getElementById("bar").style.background = "#38bdf8";
      return;
    }

    const t = new ort.Tensor("float32", geom, [1, inDim]);
    const res = await session.run({ landmarks: t });
    const probs = Array.from(res.probs.data);
    refineUV(probs, geom);
    probBuf.push(probs);
    if (probBuf.length > 4) probBuf.shift();

    const avg = new Array(probs.length).fill(0);
    for (const p of probBuf) {
      for (let i = 0; i < p.length; i++) avg[i] += p[i] / probBuf.length;
    }

    let bi = -1, bestVal = -1, secondVal = 0;
    for (let i = 0; i < avg.length; i++) {
      const lbl = String(classes[i] ?? "").trim();
      if (DIGIT_RE.test(lbl)) continue;
      if (avg[i] > bestVal) {
        secondVal = bestVal > 0 ? bestVal : 0;
        bestVal = avg[i];
        bi = i;
      } else if (avg[i] > secondVal) {
        secondVal = avg[i];
      }
    }
    if (bi < 0) return;

    const label = classes[bi], conf = bestVal, margin = bestVal - secondVal, now = performance.now();
    document.getElementById("sign").textContent = label;

    if (conf > MIN_CONF && margin >= MIN_MARGIN && label !== "NOTHING" && now > cooldown) {
      if (label === stableTok) {
        const pct = Math.min(100, ((now - stableStart) / LETTER_HOLD_MS) * 100);
        document.getElementById("bar").style.width = `${pct}%`;
        document.getElementById("bar").style.background = "#34d399";
        document.getElementById("sub").textContent = `${Math.round(conf * 100)}% — locking`;
        if (pct >= 100) {
          if (label === "SPACE") {
            outText += " ";
            recordHistory("SPACE", "Hold", conf);
          } else if (label === "DEL") {
            outText = outText.slice(0, -1);
            recordHistory("DEL", "Hold", conf);
          } else {
            outText += label;
            recordHistory(label, "Hold", conf);
          }
          renderText();
          cooldown = now + LETTER_COOLDOWN_MS;
          stableTok = null;
          document.getElementById("bar").style.width = "0%";
        }
      } else {
        stableTok = label;
        stableStart = now;
      }
    } else {
      stableTok = null;
      document.getElementById("bar").style.width = `${Math.round(conf * 40)}%`;
      document.getElementById("bar").style.background = "#f59e0b";
      document.getElementById("sub").textContent = `${Math.round(conf * 100)}% — hold steady`;
    }
  } finally {
    busy = false;
  }
}

function loop(ts) {
  const w = canvas.width, h = canvas.height;
  offCtx.save();
  offCtx.translate(w, 0);
  offCtx.scale(-1, 1);
  offCtx.drawImage(video, 0, 0, w, h);
  offCtx.restore();
  ctx.drawImage(off, 0, 0, w, h);

  const hRes = handLM.detectForVideo(off, ts);
  if (!autoMode) {
    if (hRes.landmarks?.length) {
      hRes.landmarks.forEach((lms, idx) => drawHand(lms, w, h, idx));
    }
    document.getElementById("sign").textContent = "PAUSED";
    document.getElementById("sub").textContent = "Tap Paused to resume";
    document.getElementById("bar").style.width = "0%";
  } else if (hRes.landmarks?.length) {
    hRes.landmarks.forEach((lms, idx) => drawHand(lms, w, h, idx));
    const lms = hRes.landmarks[0];
    const now = performance.now();
    const dyn = now > cooldown ? checkJZ(lms) : null;
    if (dyn) {
      outText += dyn;
      renderText();
      recordHistory(dyn, "Motion", 1.0);
      cooldown = now + MOTION_COOLDOWN_MS;
      stableTok = null;
      probBuf = [];
      document.getElementById("sign").textContent = dyn;
      document.getElementById("sub").textContent = `Motion "${dyn}" locked`;
      document.getElementById("bar").style.width = "100%";
    } else if (!busy) {
      predict(extractGeom(lms));
    }
  } else {
    probBuf = [];
    stableTok = null;
    jTrail = [];
    zTrail = [];
    document.getElementById("sign").textContent = "WAITING";
    document.getElementById("sub").textContent = "Show hand to spell";
    document.getElementById("bar").style.width = "0%";
  }

  document.getElementById("fps").textContent = `${Math.round(1000 / Math.max(ts - lastTs, 1))} FPS`;
  lastTs = ts;
  requestAnimationFrame(loop);
}
init();
</script>
